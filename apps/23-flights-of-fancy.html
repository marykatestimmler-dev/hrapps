<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flights of Fancy ✈️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #aee3f5;
    --sky-bottom: #fdf4dd;      /* warm cream horizon */
    --ink: #3a4a5a;
    --accent: #eda23b;          /* sunny amber — the lead color */
    --accent-deep: #c97f15;     /* darker amber for text links */
    --accent-soft: #fbe7c0;
    --card: #ffffff;
    --pink: #e8739e;            /* pink, demoted to a cameo role */
    --teal: #4fb3bf;
    --rounded: "Baloo 2", ui-rounded, "Hiragino Maru Gothic ProN", "Avenir Next", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    min-height: 100vh;
    color: var(--ink);
    overflow-x: hidden;
  }
  /* ---- a whole sky of drifting clouds ---- */
  .cloud {
    position: fixed; background: rgba(255,255,255,0.85);
    border-radius: 100px; z-index: 0; pointer-events: none;
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: inherit; border-radius: 50%;
  }
  .cloud.c1 { width: 140px; height: 45px; top: 10%; animation-duration: 65s; }
  .cloud.c1::before { width: 60px; height: 60px; top: -28px; left: 22px; }
  .cloud.c1::after  { width: 42px; height: 42px; top: -18px; left: 70px; }
  .cloud.c2 { width: 100px; height: 34px; top: 30%; animation-duration: 90s; animation-delay: -30s; }
  .cloud.c2::before { width: 44px; height: 44px; top: -20px; left: 16px; }
  .cloud.c2::after  { width: 30px; height: 30px; top: -12px; left: 52px; }
  .cloud.c3 { width: 170px; height: 52px; top: 55%; animation-duration: 110s; animation-delay: -60s; }
  .cloud.c3::before { width: 70px; height: 70px; top: -32px; left: 28px; }
  .cloud.c3::after  { width: 50px; height: 50px; top: -22px; left: 88px; }
  .cloud.c4 { width: 80px; height: 28px; top: 18%; animation-duration: 75s; animation-delay: -50s; opacity: 0.7; }
  .cloud.c4::before { width: 36px; height: 36px; top: -16px; left: 12px; }
  .cloud.c4::after  { width: 24px; height: 24px; top: -10px; left: 42px; }
  .cloud.c5 { width: 200px; height: 60px; top: 78%; animation-duration: 130s; animation-delay: -90s; opacity: 0.75; }
  .cloud.c5::before { width: 84px; height: 84px; top: -38px; left: 34px; }
  .cloud.c5::after  { width: 58px; height: 58px; top: -26px; left: 105px; }
  .cloud.c6 { width: 120px; height: 38px; top: 44%; animation-duration: 80s; animation-delay: -15s; opacity: 0.65; }
  .cloud.c6::before { width: 50px; height: 50px; top: -24px; left: 18px; }
  .cloud.c6::after  { width: 34px; height: 34px; top: -14px; left: 60px; }
  .cloud.c7 { width: 90px; height: 30px; top: 88%; animation-duration: 100s; animation-delay: -70s; opacity: 0.6; }
  .cloud.c7::before { width: 40px; height: 40px; top: -18px; left: 14px; }
  .cloud.c7::after  { width: 26px; height: 26px; top: -11px; left: 48px; }
  @keyframes drift {
    from { left: -260px; }
    to   { left: 110vw; }
  }
  .wrap { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 40px 20px 80px; }
  header { text-align: center; margin-bottom: 28px; }
  .plane-img { width: 440px; max-width: 92%; display: inline-block; animation: bob 3s ease-in-out infinite; filter: drop-shadow(0 10px 18px rgba(90,120,160,0.3)); }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-8deg);} 50% { transform: translateY(-10px) rotate(2deg);} }
  h1 { font-family: var(--rounded); font-weight: 800; font-size: 2.6rem; letter-spacing: 0.5px; margin-top: 6px; }
  .tagline { font-style: italic; opacity: 0.75; margin-top: 6px; }
  .panel {
    background: var(--card); border-radius: 22px; padding: 26px;
    box-shadow: 0 10px 30px rgba(90,120,160,0.18);
  }
  .row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .field { flex: 1; min-width: 130px; }
  label { display: block; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; opacity: 0.7; }
  input, select {
    width: 100%; padding: 12px 14px; border: 2px solid #e3edf5; border-radius: 12px;
    font-size: 1rem; font-family: inherit; color: var(--ink); background: #fbfdff;
    transition: border-color .2s;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  button.go {
    width: 100%; padding: 15px; border: none; border-radius: 14px;
    background: var(--accent); color: white; font-size: 1.1rem; font-weight: 700;
    font-family: var(--rounded); cursor: pointer; letter-spacing: 0.5px;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 6px 16px rgba(237,162,59,0.45);
  }
  button.go:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(237,162,59,0.55); }
  button.go:active { transform: translateY(0); }
  button.go:disabled { opacity: 0.7; cursor: wait; transform: none; }
  /* ---- itinerary ---- */
  #itinerary { margin-top: 34px; display: none; }
  .boarding-pass {
    background: var(--card); border-radius: 18px; padding: 20px 24px; margin-bottom: 26px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border: 2px dashed var(--accent-soft);
  }
  .bp-city { font-size: 1.4rem; font-weight: 800; }
  .bp-sub { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.6; }
  .bp-mid { text-align: center; flex: 1; font-size: 1.4rem; }
  .bp-mid .dur { display: block; font-size: 0.8rem; opacity: 0.65; margin-top: 2px; }
  .bp-mid .dist { display: block; font-size: 0.7rem; opacity: 0.5; }
  .stop {
    position: relative; background: var(--card); border-radius: 18px;
    padding: 18px 20px; margin-bottom: 14px;
    box-shadow: 0 6px 18px rgba(90,120,160,0.12);
    animation: floatIn .5s ease both;
  }
  @keyframes floatIn { from { opacity: 0; transform: translateY(16px);} to { opacity: 1; transform: none;} }
  .stop h3 { font-size: 1.05rem; margin-bottom: 4px; }
  .stop p { font-size: 0.93rem; line-height: 1.5; opacity: 0.85; }
  .stop .mins { font-size: 0.75rem; font-weight: 700; color: var(--pink); text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; display: inline-block; }
  /* ---- resource sections ---- */
  .section { margin-top: 30px; }
  .section-title {
    font-family: var(--rounded); font-size: 1.3rem; font-weight: 700; margin-bottom: 4px;
  }
  .section-blurb { font-size: 0.9rem; opacity: 0.7; font-style: italic; margin-bottom: 14px; }
  .res-card {
    background: var(--card); border-radius: 16px; padding: 16px 18px; margin-bottom: 12px;
    box-shadow: 0 5px 14px rgba(90,120,160,0.1);
  }
  .res-card h4 { font-size: 0.98rem; margin-bottom: 3px; }
  .res-card p { font-size: 0.88rem; line-height: 1.45; opacity: 0.82; }
  .res-card a { color: var(--accent-deep); font-weight: 700; text-decoration: none; }
  .res-card a:hover { text-decoration: underline; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    display: inline-block; padding: 10px 16px; border-radius: 999px;
    background: var(--card); color: var(--ink); text-decoration: none;
    font-size: 0.88rem; font-weight: 600;
    box-shadow: 0 4px 10px rgba(90,120,160,0.12);
    border: 2px solid transparent; transition: border-color .2s, transform .15s;
  }
  .chip:hover { border-color: var(--accent); transform: translateY(-2px); }
  .chip .chip-tag { display: block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--teal); }
  .wiki-loading { font-style: italic; opacity: 0.6; padding: 10px 4px; }
  /* ---- now showing (movies) ---- */
  .movie {
    background: var(--card); border-radius: 16px; padding: 14px 18px; margin-bottom: 12px;
    box-shadow: 0 5px 14px rgba(90,120,160,0.1);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .movie-num {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent-deep);
    font-family: var(--rounded); font-weight: 800; font-size: 0.95rem;
    display: flex; align-items: center; justify-content: center;
  }
  .movie-main { flex: 1; min-width: 150px; }
  .movie-title { font-weight: 700; font-size: 1rem; }
  .movie-year { opacity: 0.6; font-weight: 600; font-size: 0.85rem; margin-left: 4px; }
  .movie-links { display: flex; gap: 8px; flex-wrap: wrap; }
  .movie-links a {
    text-decoration: none; font-size: 0.78rem; font-weight: 700;
    padding: 6px 12px; border-radius: 999px; white-space: nowrap;
    border: 2px solid transparent; transition: border-color .2s, transform .15s;
  }
  .movie-links a:hover { transform: translateY(-1px); border-color: var(--accent); }
  .ml-watch { background: var(--accent); color: #fff; }
  .ml-trailer { background: #eef6fa; color: var(--ink); }
  .ml-imdb { background: #f5c518; color: #1a1a1a; }
  .again {
    margin-top: 20px; width: 100%; padding: 13px; border-radius: 14px;
    border: 2px solid var(--accent); background: transparent; color: var(--accent);
    font-weight: 700; font-size: 1rem; font-family: inherit; cursor: pointer;
    transition: background .2s, color .2s;
  }
  .again:hover { background: var(--accent); color: white; }
  .oops {
    background: #fff7e6; border: 2px solid var(--accent); border-radius: 16px;
    padding: 16px 18px; margin-bottom: 16px; font-size: 0.92rem; line-height: 1.5;
  }
  #fallback { display: none; margin-top: 16px; }
  footer { text-align: center; margin-top: 36px; font-size: 0.85rem; opacity: 0.6; font-style: italic; }
</style>
</head>

    <p class="tagline">A whimsical itinerary for the journey itself</p>

  <div class="panel">
    <div class="row">
      <div class="field">

  const o = document.createElement('option');
  o.value = h; o.textContent = h;
  if (h === 2) o.selected = true;
  fbHours.appendChild(o);
}

// ---------- HELPERS ----------
function fill(text, from, to) {
  return text.replaceAll("{to}", to).replaceAll("{from}", from);
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function fmt(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  return h + ":" + String(m).padStart(2, "0");
}
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function yt(q) { return "https://www.youtube.com/results?search_query=" + encodeURIComponent(q); }

// haversine distance in km between two lat/lon points
function distanceKm(lat1, lon1, lat2, lon2) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*rad) * Math.cos(lat2*rad) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
// distance → estimated gate-to-gate minutes (cruise ~850 km/h + taxi/climb/descent)
function estimateMinutes(km) {
  const mins = Math.round((km / 850) * 60 + 35);
  return Math.max(35, Math.round(mins / 5) * 5);
}

// ---------- FREE APIS ----------
async function fetchJSON(url, ms = 8000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}

async function geocode(name) {
  const url = "https://geocoding-api.open-meteo.com/v1/search?name=" +
    encodeURIComponent(name) + "&count=1&language=en&format=json";
  const data = await fetchJSON(url);
  if (!data.results || !data.results.length) throw new Error("not found");
  const r = data.results[0];
  return {
    name: r.name, lat: r.latitude, lon: r.longitude,
    country: r.country || "", cc: (r.country_code || "").toUpperCase()
  };
}

async function wikiSearch(query, limit = 2) {
  const url = "https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=" +
    encodeURIComponent(query) + "&format=json&origin=*&srlimit=" + limit;
  const data = await fetchJSON(url);
  return (data.query && data.query.search ? data.query.search : []).map(s => ({
    title: s.title,
    snippet: s.snippet.replace(/<[^>]*>/g, ""),
    url: "https://en.wikipedia.org/wiki/" + encodeURIComponent(s.title.replaceAll(" ", "_"))
  }));
}

// ---------- MOVIES (Wikidata, no API key) ----------
// Wikidata IDs that mean "this entity is a populated place" (city, town, capital, etc.)
const PLACE_TYPES = new Set(["Q515","Q486972","Q1549591","Q5119","Q200250","Q15284",
  "Q3957","Q484170","Q1093829","Q1637706","Q1066984","Q15253706","Q494721","Q1187811"]);

// Find the Wikidata entity for a city. A plain text search for "Tokyo" can return a
// song or a person first, so we keep only candidates that are actually places and
// prefer the best-known one (most language editions = most famous).
async function wikidataCityId(name) {
  const sUrl = "https://www.wikidata.org/w/api.php?action=wbsearchentities&search=" +
    encodeURIComponent(name) + "&language=en&format=json&origin=*&limit=7";
  const s = await fetchJSON(sUrl);
  const ids = (s.search || []).map(c => c.id);
  if (!ids.length) return null;
  const gUrl = "https://www.wikidata.org/w/api.php?action=wbgetentities&ids=" +
    ids.join("|") + "&props=claims|sitelinks&format=json&origin=*";
  const g = await fetchJSON(gUrl);
  const ents = g.entities || {};
  let best = null, bestLinks = -1;
  for (const qid of ids) {                       // keep original search ranking
    const e = ents[qid]; if (!e) continue;
    const types = new Set((e.claims?.P31 || [])
      .map(c => c.mainsnak?.datavalue?.value?.id).filter(Boolean));
    let isPlace = false;
    for (const t of types) if (PLACE_TYPES.has(t)) { isPlace = true; break; }
    if (!isPlace) continue;
    const links = Object.keys(e.sitelinks || {}).length;
    if (links > bestLinks) { bestLinks = links; best = qid; }
  }
  return best;
}

// Notable films either filmed in (P915) or set in (P840) the city, ranked by how
// many Wikipedia editions cover them (a decent proxy for "you've heard of this one").
async function wikidataFilms(qid, limit = 8) {
  // wikibase:sitelinks is a precomputed popularity count, so ranking is fast even
  // for film-heavy cities like London or Rome (avoids joining every sitelink row).
  const sparql = `SELECT ?film ?filmLabel (MIN(YEAR(?date)) AS ?year)
      (SAMPLE(?imdb) AS ?imdbId) (SAMPLE(?s) AS ?sl) WHERE {
    ?film wdt:P31/wdt:P279* wd:Q11424 .
    { ?film wdt:P915 wd:${qid} } UNION { ?film wdt:P840 wd:${qid} }
    ?film wikibase:sitelinks ?s .
    OPTIONAL { ?film wdt:P577 ?date }
    OPTIONAL { ?film wdt:P345 ?imdb }
    SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
  } GROUP BY ?film ?filmLabel ORDER BY DESC(?sl) LIMIT ${limit}`;
  const url = "https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(sparql);
  const data = await fetchJSON(url, 12000);
  return (data.results?.bindings || []).map(b => ({
    title: b.filmLabel?.value || "Untitled",
    year: b.year?.value || "",
    imdb: b.imdbId?.value || ""
  })).filter(m => m.title && !/^Q\d+$/.test(m.title));   // drop unlabeled rows
}

// ---------- WHIMSY ENGINE ----------
// Picks a hand of untimed activities: one takeoff ritual, a few mid-flight
// fancies (more for longer flights), and one landing ritual.
function pickActivities(total) {
  const isLong = total >= 240;
  const midCount = isLong ? 6 : (total >= 120 ? 4 : 3);
  return [
    shuffle(EARLY)[0],
    ...shuffle(MIDDLE.filter(a => !a.long || isLong)).slice(0, midCount),
    shuffle(LATE)[0],
  ];
}

async function loadSkyUniversity(to, country) {
  const queries = [
    { q: "architecture of " + to, tag: "Architecture 🏛️" },
    { q: "history of " + to, tag: "History 📜" },
    { q: to + " cuisine food", tag: "Food 🍽️" },
    { q: to + " culture arts", tag: "Culture 🎭" },
  ];
  const settled = await Promise.allSettled(queries.map(x => wikiSearch(x.q, 1)));
  const seen = new Set();
  let cards = "";
  settled.forEach((res, i) => {
    if (res.status !== "fulfilled") return;
    res.value.forEach(hit => {
      if (seen.has(hit.title)) return;
      seen.add(hit.title);
      cards += `
      <div class="res-card">
        <h4>${queries[i].tag} — <a href="${hit.url}" target="_blank" rel="noopener">${esc(hit.title)}</a></h4>
        <p>${esc(hit.snippet)}…</p>
      </div>`;
    });
  });
  const el = document.getElementById("skyU");
  if (!el) return;
  el.innerHTML = cards || `
    <div class="res-card"><h4>The sky library is napping 😴</h4>
    <p>We couldn't reach Wikipedia just now. Try
    <a href="https://en.wikipedia.org/w/index.php?search=${encodeURIComponent(to)}" target="_blank" rel="noopener">searching Wikipedia for ${esc(to)}</a> directly.</p></div>`;
}

async function loadNowShowing(to) {
  const el = () => document.getElementById("nowShowing");
  try {
    const qid = await wikidataCityId(to);
    let films = qid ? await wikidataFilms(qid) : [];
    const node = el(); if (!node) return;
    if (films.length) {
      node.innerHTML = films.map((m, i) => {
        const q = encodeURIComponent(m.title);
        const watch = "https://www.justwatch.com/us/search?q=" + q;
        const trailer = yt(m.title + (m.year ? " " + m.year : "") + " trailer");
        const imdb = m.imdb
          ? "https://www.imdb.com/title/" + encodeURIComponent(m.imdb) + "/"
          : "https://www.imdb.com/find/?q=" + q;
        return `
        <div class="movie">
          <div class="movie-num">${i + 1}</div>
          <div class="movie-main">
            <span class="movie-title">${esc(m.title)}</span>${m.year ? `<span class="movie-year">${esc(m.year)}</span>` : ""}
          </div>
          <div class="movie-links">
            <a class="ml-watch" href="${watch}" target="_blank" rel="noopener">▶ Where to watch</a>
            <a class="ml-trailer" href="${trailer}" target="_blank" rel="noopener">🎞 Trailer</a>
            <a class="ml-imdb" href="${imdb}" target="_blank" rel="noopener">IMDb</a>
          </div>
        </div>`;
      }).join("");
    } else {
      node.innerHTML = `
      <div class="res-card"><h4>No films catalogued for ${esc(to)} just yet 🎞️</h4>
      <p>Our movie reel comes from Wikidata, which knows more about big cities than tiny towns.
      Try a nearby major city, or browse
      <a href="https://www.justwatch.com/us/search?q=${encodeURIComponent(to)}" target="_blank" rel="noopener">JustWatch for "${esc(to)}"</a>.</p></div>`;
    }
  } catch (e) {
    const node = el(); if (!node) return;
    node.innerHTML = `
    <div class="res-card"><h4>The projector jammed 🎞️</h4>
    <p>Couldn't reach the movie archive just now. You can still browse
    <a href="https://www.justwatch.com/us/search?q=${encodeURIComponent(to)}" target="_blank" rel="noopener">JustWatch for "${esc(to)}"</a>.</p></div>`;
  }
}

function whimsySectionHTML(fromName, toName, total) {
  const acts = pickActivities(total);
  let cards = "";
  acts.forEach((s, idx) => {
    cards += `
    <div class="stop" style="animation-delay:${idx * 0.08}s">
      <h3>${fill(esc(s.t), esc(fromName), esc(toName))}</h3>
      <p>${fill(esc(s.d), esc(fromName), esc(toName))}</p>
      <span class="mins">~${s.m} min</span>

  });
  return `
  <div class="section">
    <div class="section-title">🎠 Flights of Fancy</div>
    <div class="section-blurb">A hand-dealt set of mid-air amusements — no schedule, no pressure, pure whimsy. Shuffle for a fresh hand.</div>

}

function renderItinerary(fromName, toName, total, distKm, country, cc) {
  const box = document.getElementById('itinerary');
  const h = Math.floor(total / 60), m = total % 60;
  let html = `
    <div class="boarding-pass">
      <div><div class="bp-sub">From</div><div class="bp-city">${esc(fromName)}</div></div>
      <div class="bp-mid">✈️
        <span class="dur">~${h}h ${String(m).padStart(2,"0")}m estimated</span>
        ${distKm ? `<span class="dist">${Math.round(distKm).toLocaleString()} km as the plane flies</span>` : ""}
      </div>
      <div><div class="bp-sub">To</div><div class="bp-city">${esc(toName)}</div></div>
    </div>`;
  html += mediaCartHTML(toName, country);
  html += nowShowingShellHTML(toName);
  html += skyUniversityShellHTML(toName);
  html += sayHelloHTML(toName, country, cc);
  html += whenYouLandHTML(toName, country);
  html += whimsySectionHTML(fromName, toName, total);
  box.innerHTML = html;
  box.style.display = "block";
  box.scrollIntoView({ behavior: "smooth", block: "start" });
  loadNowShowing(toName);
  loadSkyUniversity(toName, country);
}

// remember the last flight so the shuffle button can re-deal just the whimsy cards
let lastFlight = null;
function reshuffle() {
  if (!lastFlight) return;
  const [fromName, toName, total] = lastFlight;
  const el = document.getElementById('whimsyCards');
  if (!el) return;
  const acts = pickActivities(total);
  el.innerHTML = acts.map((s, idx) => `
    <div class="stop" style="animation-delay:${idx * 0.08}s">
      <h3>${fill(esc(s.t), esc(fromName), esc(toName))}</h3>
      <p>${fill(esc(s.d), esc(fromName), esc(toName))}</p>
      <span class="mins">~${s.m} min</span>
    </div>`).join("");
}

  const btn = document.getElementById('goBtn');
  const fromInput = document.getElementById('from').value.trim();
  const toInput = document.getElementById('to').value.trim();
  document.getElementById('fallback').style.display = "none";
  if (!fromInput || !toInput) {
    document.getElementById('oopsMsg').textContent = "Tell me both cities and I'll do the rest! ✏️";
    document.getElementById('fallback').style.display = "block";
    document.getElementById('fallback').querySelector('.row').style.display = "none";
    document.getElementById('fallback').querySelectorAll('button').forEach(b => b.style.display = "none");
    return;
  }
  btn.disabled = true;
  btn.textContent = "Charting your course… 🧭";
  try {
    const [a, b] = await Promise.all([geocode(fromInput), geocode(toInput)]);
    const km = distanceKm(a.lat, a.lon, b.lat, b.lon);
    const total = estimateMinutes(km);
    lastFlight = [a.name, b.name, total, km, b.country, b.cc];
    renderItinerary(...lastFlight);
  } catch (e) {
    const fb = document.getElementById('fallback');
    fb.style.display = "block";
    fb.querySelector('.row').style.display = "flex";
    fb.querySelectorAll('button').forEach(x => x.style.display = "block");
    document.getElementById('oopsMsg').innerHTML =
      "🌩️ I couldn't look up those cities just now (a misspelling, or no internet?). " +
      "Double-check the names and try again — or tell me the flight time yourself below and we'll carry on with the whimsy.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Chart my flight of fancy ✨";
  }
}

function manualGenerate() {
  const fromInput = document.getElementById('from').value.trim() || "Home";
  const toInput = document.getElementById('to').value.trim() || "Somewhere Wonderful";
  const total = parseInt(fbHours.value) * 60 + parseInt(document.getElementById('fbMins').value);
  lastFlight = [fromInput, toInput, total, null, "", ""];
  renderItinerary(...lastFlight);
}
</script>
</body>
